<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unifly Bangladesh - Enterprise Double-Entry Accounting Software</title>
  <meta name="description"
    content="Full-featured enterprise accounting software with double-entry bookkeeping, customer invoicing, vendor billing, bank reconciliation, and GAAP/IFRS financial statements." />

  <!-- Modern Typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <link rel="stylesheet" href="css/views.css" />
  <link rel="stylesheet" href="css/print.css" />

<body>

    <!-- 1. Top Navbar Header (Enterprise Style) -->

    <section id="control-panel-container"></section>
